name: Windows build and verification
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/Kerlo/Kerlo.csproj
      - name: Compile release
        run: dotnet build src/Kerlo/Kerlo.csproj --configuration Release --no-restore -warnaserror
      - name: Run core regression checks
        run: dotnet run --project tests/Kerlo.SelfTests/Kerlo.SelfTests.csproj --configuration Release
      - name: Exercise real Windows telemetry APIs
        run: dotnet run --project tests/Kerlo.WindowsChecks/Kerlo.WindowsChecks.csproj --configuration Release
      - name: Publish portable Windows x64 build
        shell: pwsh
        run: |
          dotnet publish src/Kerlo/Kerlo.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/Kerlo-win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Windows GUI startup (headless runner; required check)
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) "artifacts/Kerlo-win-x64/Kerlo.exe"
          $app = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $app.Refresh()
            if ($app.HasExited) {
              throw "Kerlo exited during startup (code $($app.ExitCode)); requires investigation on an interactive desktop"
            }
            Write-Host "PASS: Kerlo remained running after 8 seconds on Windows. Working set: $([math]::Round($app.WorkingSet64 / 1MB)) MB"
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Kerlo-Windows-x64-unsigned
          path: artifacts/Kerlo-win-x64/
          if-no-files-found: error
